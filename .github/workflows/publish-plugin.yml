name: Validate & Publish Plugin

# Runs on PRs that modify the plugin directory structure.
# On merge to main, automatically creates a GitHub Release
# and updates registry.json with the correct downloadUrl.

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'registry.json'
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'registry.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry.json is valid JSON
        run: python3 -c "import json; json.load(open('registry.json'))"

      - name: Check for duplicate action names
        run: |
          python3 -c "
          import json
          data = json.load(open('registry.json'))
          seen = {}
          conflicts = []
          for p in data.get('plugins', []):
              for action in p.get('actions', []):
                  if action in seen:
                      conflicts.append(f'Action \"{action}\" in \"{p[\"name\"]}\" already used by \"{seen[action]}\"')
                  else:
                      seen[action] = p['name']
          if conflicts:
              print('DUPLICATE ACTIONS:')
              for c in conflicts: print(c)
              exit(1)
          print('No duplicate actions found.')
          "

      - name: Check all download URLs resolve
        run: |
          python3 -c "
          import json, urllib.request
          data = json.load(open('registry.json'))
          for p in data.get('plugins', []):
              url = p.get('downloadUrl', '')
              if url:
                  try:
                      req = urllib.request.Request(url, method='HEAD')
                      req.add_header('User-Agent', 'INGenious-CI/1.0')
                      resp = urllib.request.urlopen(req, timeout=10)
                      if resp.status != 200:
                          print(f'WARN: {url} returned {resp.status}')
                  except Exception as e:
                      print(f'WARN: Could not reach {url}: {e}')
          "

      - name: Check every plugin JAR has pluginEntryClasses in manifest
        run: |
          for dir in plugins/*/; do
            for jar in "$dir"*.jar; do
              echo "Checking manifest for $jar..."
              ENTRY=$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null | grep "pluginEntryClasses" || true)
              if [ -z "$ENTRY" ]; then
                echo "ERROR: $jar is missing pluginEntryClasses in MANIFEST.MF"
                exit 1
              fi
              echo "  Found: $ENTRY"
            done
          done

      - name: Check README.md exists for each plugin
        run: |
          for dir in plugins/*/; do
            PLUGIN_NAME=$(basename "$dir")
            if [ ! -f "$dir/README.md" ]; then
              echo "ERROR: Plugin '$PLUGIN_NAME' is missing README.md"
              exit 1
            fi
            WORD_COUNT=$(wc -w < "$dir/README.md")
            if [ "$WORD_COUNT" -lt 50 ]; then
              echo "ERROR: Plugin '$PLUGIN_NAME' README.md has only $WORD_COUNT words (minimum 50 required)"
              exit 1
            fi
            echo "  README.md for $PLUGIN_NAME: $WORD_COUNT words (OK)"
          done

      - name: Check for suspicious imports (warn only)
        run: |
          echo "Scanning for potentially dangerous APIs..."
          for jar in plugins/*/*.jar; do
            DANGEROUS=$(unzip -l "$jar" 2>/dev/null | grep -iE 'Runtime|ProcessBuilder|ClassLoader' || true)
            if [ -n "$DANGEROUS" ]; then
              echo "::warning file=$jar::JAR references Runtime/ProcessBuilder/ClassLoader — please review"
            fi
          done

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: plugins/
          severity: HIGH,CRITICAL

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish new plugin releases
        run: |
          python3 -c "
          import json, os, subprocess, re
          registry = json.load(open('registry.json'))
          changed = False
          for plugin_dir in sorted(os.listdir('plugins')):
              dir_path = os.path.join('plugins', plugin_dir)
              if not os.path.isdir(dir_path): continue
              jars = [f for f in os.listdir(dir_path) if f.endswith('.jar')]
              if not jars: continue
              jar_name = jars[0]
              # Extract version from filename (e.g. myplugin-1.0.0.jar)
              match = re.match(r'(.+?)-(\d+\.\d+\.\d+)\.jar', jar_name)
              if not match:
                  print(f'SKIP: {jar_name} does not match NAME-VERSION.jar pattern')
                  continue
              plugin_name, version = match.group(1), match.group(2)
              tag = f'{plugin_name}-v{version}'
              # Check if release already exists
              result = subprocess.run(['gh', 'release', 'view', tag], capture_output=True)
              if result.returncode == 0:
                  print(f'SKIP: release {tag} already exists')
                  continue
              # Create release
              jar_path = os.path.join(dir_path, jar_name)
              subprocess.run([
                  'gh', 'release', 'create', tag,
                  jar_path,
                  '--title', f'{plugin_name} v{version}',
                  '--notes', f'Published by CI: {plugin_name} v{version}'
              ], check=True)
              print(f'Created release: {tag}')
              # Update downloadUrl in registry
              asset_url = f'https://github.com/{os.environ[\"GITHUB_REPOSITORY\"]}/releases/download/{tag}/{jar_name}'
              for entry in registry['plugins']:
                  if entry['name'] == plugin_name and entry['version'] == version:
                      entry['downloadUrl'] = asset_url
                      changed = True
          if changed:
              with open('registry.json', 'w') as f:
                  json.dump(registry, f, indent=2)
                  f.write('\n')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated registry.json
        run: |
          git config user.name "ingenious-bot"
          git config user.email "bot@ingenious.dev"
          git add registry.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update registry download URLs" && git push)
