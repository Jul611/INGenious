# Plugin Contributor Pipeline Template (Azure Pipelines)
#
# Hand this file to plugin authors to drop into their OWN repo and their
# OWN Azure DevOps project. It builds their plugin and runs the same
# sanity checks the marketplace's own validate-pipeline.yml runs, so
# obviously-broken submissions get caught here, on the contributor's own
# infrastructure, instead of wasting a round-trip through the marketplace's
# CI and a reviewer's attention.
#
# This does NOT publish anywhere -- publishing to the Azure Artifacts feed
# stays entirely on the marketplace side (publish-pipeline.yml, triggered
# by merging a submission PR). Passing this pipeline is a courtesy
# pre-check, not a trust boundary: once you submit via the IDE (pointing
# it at this repo+branch), the marketplace runs its OWN independent
# validate-pipeline.yml against the same source before a human ever
# reviews it -- since the marketplace is the one taking the action of
# deploying to the shared feed afterward, it can't rely solely on what
# this pipeline already reported.

trigger:
  branches:
    include:
      - main # TODO: change if you build/validate from a different branch

pr:
  branches:
    include:
      - main # TODO: same branch as above -- also validate on PRs into it, if you review changes that way

pool:
  vmImage: "ubuntu-latest"

variables:
  PLUGIN_PATH: "." # TODO: path to this plugin's pom.xml, if not at repo root
  PLUGIN_MAVEN_GROUP_ID: "com.ing.plugins" # required namespace -- confirm with the marketplace team if unsure

steps:
  - checkout: self
    fetchDepth: 0

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: "17"
      jdkArchitectureOption: "x64"
      jdkSourceOption: "PreInstalled"

  - script: |
      mvn -B install:install-file -Dfile=ci/vendor/ingenious-api-3.0.jar -DgroupId=com.ing -DartifactId=ingenious-api -Dversion=3.0 -Dpackaging=jar
    displayName: "Seed local repo with ingenious-api"
    # Get this jar from the marketplace team, or build it yourself from the
    # INGenious source: mvn -q -f ingenious-api/pom.xml clean package -DskipTests
    # then copy target/ingenious-api-3.0.jar to ci/vendor/ in this repo.
    # It isn't published anywhere authenticated today, so it has to be
    # vendored like this rather than resolved as a normal dependency.

  - script: |
      set -e
      test -f "$(PLUGIN_PATH)/pom.xml" || { echo "##vso[task.logissue type=error]Missing pom.xml"; exit 1; }
      test -f "$(PLUGIN_PATH)/README.md" || { echo "##vso[task.logissue type=error]Missing README.md"; exit 1; }
      test -f "$(PLUGIN_PATH)/.submission.json" || { echo "##vso[task.logissue type=error]Missing .submission.json"; exit 1; }
    displayName: "Required files present"

  - script: |
      set -e
      WORDS=$(wc -w < "$(PLUGIN_PATH)/README.md")
      [ "$WORDS" -ge 50 ] || { echo "##vso[task.logissue type=error]README.md has only $WORDS words (minimum 50)"; exit 1; }
    displayName: "README has at least 50 words"

  - script: |
      set -e
      GROUP_ID=$(mvn -q -f "$(PLUGIN_PATH)/pom.xml" help:evaluate -Dexpression=project.groupId -DforceStdout)
      [ "$GROUP_ID" = "$(PLUGIN_MAVEN_GROUP_ID)" ] || { echo "##vso[task.logissue type=error]groupId '$GROUP_ID' must be '$(PLUGIN_MAVEN_GROUP_ID)'"; exit 1; }
    displayName: "pom.xml groupId matches required namespace"

  - script: |
      mvn -B -f "$(PLUGIN_PATH)/pom.xml" clean package
    displayName: "Build plugin from source"

  - script: |
      set -e
      JAR=$(find "$(PLUGIN_PATH)/target" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -1)
      unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -q '^pluginEntryClasses' || { echo "##vso[task.logissue type=error]$JAR missing pluginEntryClasses"; exit 1; }
    displayName: "Manifest has pluginEntryClasses"
