# # Cleanup Stale Submission Branches (Azure Pipelines)
# #
# # Scheduled housekeeping: deletes plugin/<name>/v<version> branches whose
# # pull request was closed WITHOUT merging (a rejected or abandoned
# # submission), once they've been closed for at least CLEANUP_GRACE_DAYS.
# #
# # Deliberately narrow scope, to avoid ever touching the wrong thing:
# #   - Only branches matching the plugin/** submission naming pattern.
# #   - Only when tied to a PR that is closed AND not merged (never an open
# #     PR, no matter how old).
# #   - Only same-repo branches (isCrossRepository == false) -- a
# #     fork-submitted PR's branch lives on the contributor's own fork, not
# #     here, and this pipeline has no business touching another repo.
# # Merged PRs are handled separately by this repo's own "Automatically
# # delete head branches" setting (Settings -> General -> Pull Requests) --
# # this pipeline only covers the case that setting doesn't: rejected PRs.
# #
# # Authenticates via GitHubAppToken@1 (the org's installed GitHub App
# # connection, exchanged for a short-lived installation token) rather than
# # a standing GitHub PAT -- a PAT isn't allowed for this. Same task and
# # same githubAppConnection value as publish-pipeline.yml, which has since
# # confirmed this task/connection pair actually works end to end.
# # https://github.com/tspascoal/azure-pipelines-create-github-app-token-task
# #
# # Still deliberately disabled end-to-end (commented out below) -- holding
# # off on enabling any branch-deletion pipeline until that's explicitly
# # asked for. This pass only brings the dormant code current (task name,
# # connection value) so it's ready to uncomment later without also needing
# # a rewrite at that point.
# #
# # Required pipeline variable before ever enabling this (Pipelines -> Edit
# # -> Variables): GITHUB_REPO_SLUG, same value and same externally-set
# # convention as publish-pipeline.yml -- deliberately not hardcoded here.

