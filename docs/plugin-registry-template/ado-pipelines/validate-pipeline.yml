# Validate Plugin Submission (Azure Pipelines)
#
# Runs on every PR against the registry branch (not path-filtered -- see
# below for why). Ported from the old GitHub Actions validate.yml:
# GitHub-hosted Actions runners are not available for this org, so this
# pipeline is triggered instead via Azure Pipelines' native GitHub PR
# integration (requires the GitHub App / service connection already set
# up for this repo) and reports its result back onto the PR as a GitHub
# status check, the same way the old `validate` check did.
#
# Uses no secrets and no ADO feed credentials -- safe to run against an
# untrusted fork PR's source, same intent as the GitHub Actions version.
#
# Deliberately NOT path-filtered to plugins/**, even though only that path
# is ever actually validated: this check is meant to be marked "required"
# on the branch ruleset, and a required check that's path-filtered never
# fires (and so never resolves) on a PR that doesn't touch that path --
# which includes publish-pipeline.yml's own bot registry-patch PR (that
# one only touches registry.json). So this pipeline runs on every PR and
# passes through cleanly when there's nothing plugins/**-related to check,
# rather than silently never running at all.

trigger: none

pr:
  branches:
    include:
      - registry-branch

pool:
  vmImage: "ubuntu-latest" # TODO: replace with your org's pool name if Microsoft-hosted agents aren't allowed

variables:
  PLUGIN_MAVEN_GROUP_ID: "com.ing.plugins" # matches every plugin-examples/*/pom.xml groupId

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true # needed so the later `git fetch origin` below can authenticate -- without this, the checkout's own credential isn't retained for script-level git commands

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: "17"
      jdkArchitectureOption: "x64"
      jdkSourceOption: "PreInstalled"

  - script: |
      set -e
      TARGET_BRANCH=$(echo "$(System.PullRequest.TargetBranch)" | sed 's#refs/heads/##')
      git fetch origin "$TARGET_BRANCH"
      CHANGED=$(git diff --name-only "origin/$TARGET_BRANCH...HEAD" -- 'plugins/*' | awk -F/ '{print $2}' | sort -u)
      COUNT=$(echo "$CHANGED" | grep -c . || true)
      if [ "$COUNT" -gt 1 ]; then
        echo "##vso[task.logissue type=error]At most one plugins/<name>/ directory may change per PR (found: $CHANGED)"
        exit 1
      fi
      if [ "$COUNT" -eq 0 ]; then
        echo "No plugins/** changes in this PR -- nothing to validate here, passing through. (Expected for the bot's own registry.json-only patch PR.)"
        echo "##vso[task.setvariable variable=pluginName]"
      else
        echo "##vso[task.setvariable variable=pluginName]$CHANGED"
      fi
    displayName: "Determine changed plugin directory"

  - script: |
      mvn -B install:install-file -Dfile=ci/vendor/ingenious-api-3.0.jar -DgroupId=com.ing -DartifactId=ingenious-api -Dversion=3.0 -Dpackaging=jar
    displayName: "Seed local repo with ingenious-api"
    condition: ne(variables['pluginName'], '')

  - script: |
      set -e
      NAME="$(pluginName)"
      test -f "plugins/$NAME/pom.xml" || { echo "##vso[task.logissue type=error]Missing pom.xml"; exit 1; }
      test -f "plugins/$NAME/.submission.json" || { echo "##vso[task.logissue type=error]Missing .submission.json"; exit 1; }
      # Description file: no naming requirement, just exactly one *.md -- matches the
      # Publish tab, which never renames it during staging, so whatever the contributor
      # called it is what actually lands here.
      MD_FILES=$(find "plugins/$NAME" -maxdepth 1 -iname '*.md')
      MD_COUNT=$(echo "$MD_FILES" | grep -c . || true)
      if [ "$MD_COUNT" -eq 0 ]; then
        echo "##vso[task.logissue type=error]No .md file found in plugins/$NAME -- a description is required"
        exit 1
      elif [ "$MD_COUNT" -gt 1 ]; then
        echo "##vso[task.logissue type=error]Multiple .md files found in plugins/$NAME -- keep exactly one so it's unambiguous which is the description"
        exit 1
      fi
      echo "##vso[task.setvariable variable=descriptionFile]$MD_FILES"
    displayName: "Required files present"
    condition: ne(variables['pluginName'], '')

  - script: |
      set -e
      WORDS=$(wc -w < "$(descriptionFile)")
      [ "$WORDS" -ge 50 ] || { echo "##vso[task.logissue type=error]$(descriptionFile) has only $WORDS words (minimum 50)"; exit 1; }
    displayName: "Description has at least 50 words"
    condition: ne(variables['pluginName'], '')

  - script: |
      set -e
      NAME="$(pluginName)"
      GROUP_ID=$(mvn -q -f "plugins/$NAME/pom.xml" help:evaluate -Dexpression=project.groupId -DforceStdout)
      [ "$GROUP_ID" = "$(PLUGIN_MAVEN_GROUP_ID)" ] || { echo "##vso[task.logissue type=error]groupId '$GROUP_ID' must be '$(PLUGIN_MAVEN_GROUP_ID)'"; exit 1; }
    displayName: "pom.xml groupId matches required namespace"
    condition: ne(variables['pluginName'], '')

  - script: |
      mvn -B -f "plugins/$(pluginName)/pom.xml" clean package
    displayName: "Build plugin from source"
    condition: ne(variables['pluginName'], '')

  - script: |
      set -e
      NAME="$(pluginName)"
      JAR=$(find "plugins/$NAME/target" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -1)
      unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -q '^pluginEntryClasses' || { echo "##vso[task.logissue type=error]$JAR missing pluginEntryClasses"; exit 1; }
    displayName: "Manifest has pluginEntryClasses"
    condition: ne(variables['pluginName'], '')
