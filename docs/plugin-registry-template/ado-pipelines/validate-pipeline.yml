# Validate Plugin Submission (Azure Pipelines)
#
# Runs on every PR against the registry branch (not path-filtered -- see
# below for why). Ported from the old GitHub Actions validate.yml:
# GitHub-hosted Actions runners are not available for this org, so this
# pipeline is triggered instead via Azure Pipelines' native GitHub PR
# integration (requires the GitHub App / service connection already set
# up for this repo) and reports its result back onto the PR as a GitHub
# status check, the same way the old `validate` check did.
#
# Uses no secrets and no ADO feed credentials -- safe to run against an
# untrusted fork PR's source, same intent as the GitHub Actions version.
#
# That's this file's own design, but it also depends on Azure Pipelines'
# fork-PR handling actually withholding what it claims to. Confirmed against
# Microsoft's own docs (learn.microsoft.com/azure/devops/pipelines/security/
# secure-access-to-repos, "Forked GitHub repositories"): fork PR builds get
# secrets withheld and restricted permissions by default -- "Make secrets
# available to builds of forks" and "Make fork builds have the same
# permissions as regular builds" are both opt-in and off by default, which
# is functionally equivalent to GitHub Actions' pull_request (not
# pull_request_target) trigger semantics. That's a project/org-level ADO
# setting under Project Settings -> Pipelines -> Settings -> Triggers, not
# something this YAML controls -- worth a one-time check that nobody has
# flipped it on org-wide, since that would silently widen what a fork PR
# build can reach regardless of what's written here.
#
# Deliberately NOT path-filtered to plugins/**, even though only that path
# is ever actually validated: this check is meant to be marked "required"
# on the branch ruleset, and a required check that's path-filtered never
# fires (and so never resolves) on a PR that doesn't touch that path --
# which includes publish-pipeline.yml's own bot registry-patch PR (that
# one only touches registry.json). So this pipeline runs on every PR and
# passes through cleanly when there's nothing plugins/**-related to check,
# rather than silently never running at all.
#
# Two stages, deliberately on separate agents/jobs rather than one job:
# - Validate: the original structural/build checks below. This stage runs
#   `mvn clean package` directly against the contributor's own pom.xml,
#   which can execute arbitrary Maven-plugin code -- that's fine today
#   only because this stage truly holds no credentials at all.
# - SecurityScan: Checkmarx, scanning the same submitted plugin source for
#   vulnerabilities. Kept in its own stage (fresh agent, no shared process
#   or environment with the step above) specifically so the Checkmarx
#   service-connection credential is never resolvable from a job that also
#   runs untrusted contributor build code. Not wired in yet -- see the TODO
#   in that stage. Scoped to plugins only: Reusable Components never ship
#   compiled/executable source, so there's nothing meaningful for a SAST
#   scan to check there.

trigger: none

pr:
  branches:
    include:
      - registry-branch

variables:
  PLUGIN_MAVEN_GROUP_ID: "com.ing.plugins" # matches every plugin-examples/*/pom.xml groupId

stages:
  - stage: Validate
    jobs:
      - job: ValidatePlugin
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true # needed so the later `git fetch origin` below can authenticate -- without this, the checkout's own credential isn't retained for script-level git commands

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: "17"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          - script: |
              set -e
              TARGET_BRANCH=$(echo "$(System.PullRequest.TargetBranch)" | sed 's#refs/heads/##')
              git fetch origin "$TARGET_BRANCH"
              CHANGED=$(git diff --name-only "origin/$TARGET_BRANCH...HEAD" -- 'plugins/*' | awk -F/ '{print $2}' | sort -u)
              COUNT=$(echo "$CHANGED" | grep -c . || true)
              if [ "$COUNT" -gt 1 ]; then
                echo "##vso[task.logissue type=error]At most one plugins/<name>/ directory may change per PR (found: $CHANGED)"
                exit 1
              fi
              if [ "$COUNT" -eq 0 ]; then
                echo "No plugins/** changes in this PR -- nothing to validate here, passing through. (Expected for the bot's own registry.json-only patch PR.)"
                echo "##vso[task.setvariable variable=pluginName]"
              else
                echo "##vso[task.setvariable variable=pluginName]$CHANGED"
              fi
            displayName: "Determine changed plugin directory"

          - script: |
              mvn -B install:install-file -Dfile=ci/vendor/ingenious-api-3.0.jar -DgroupId=com.ing -DartifactId=ingenious-api -Dversion=3.0 -Dpackaging=jar
            displayName: "Seed local repo with ingenious-api"
            condition: ne(variables['pluginName'], '')

          - script: |
              set -e
              NAME="$(pluginName)"
              test -f "plugins/$NAME/pom.xml" || { echo "##vso[task.logissue type=error]Missing pom.xml"; exit 1; }
              test -f "plugins/$NAME/.submission.json" || { echo "##vso[task.logissue type=error]Missing .submission.json"; exit 1; }
              # Description file: no naming requirement, just exactly one *.md -- matches the
              # Publish tab, which never renames it during staging, so whatever the contributor
              # called it is what actually lands here.
              MD_FILES=$(find "plugins/$NAME" -maxdepth 1 -iname '*.md')
              MD_COUNT=$(echo "$MD_FILES" | grep -c . || true)
              if [ "$MD_COUNT" -eq 0 ]; then
                echo "##vso[task.logissue type=error]No .md file found in plugins/$NAME -- a description is required"
                exit 1
              elif [ "$MD_COUNT" -gt 1 ]; then
                echo "##vso[task.logissue type=error]Multiple .md files found in plugins/$NAME -- keep exactly one so it's unambiguous which is the description"
                exit 1
              fi
              echo "##vso[task.setvariable variable=descriptionFile]$MD_FILES"
            displayName: "Required files present"
            condition: ne(variables['pluginName'], '')

          - script: |
              set -e
              WORDS=$(wc -w < "$(descriptionFile)")
              [ "$WORDS" -ge 50 ] || { echo "##vso[task.logissue type=error]$(descriptionFile) has only $WORDS words (minimum 50)"; exit 1; }
            displayName: "Description has at least 50 words"
            condition: ne(variables['pluginName'], '')

          - script: |
              set -e
              NAME="$(pluginName)"
              GROUP_ID=$(mvn -q -f "plugins/$NAME/pom.xml" help:evaluate -Dexpression=project.groupId -DforceStdout)
              [ "$GROUP_ID" = "$(PLUGIN_MAVEN_GROUP_ID)" ] || { echo "##vso[task.logissue type=error]groupId '$GROUP_ID' must be '$(PLUGIN_MAVEN_GROUP_ID)'"; exit 1; }
            displayName: "pom.xml groupId matches required namespace"
            condition: ne(variables['pluginName'], '')

          - script: |
              mvn -B -f "plugins/$(pluginName)/pom.xml" clean package
            displayName: "Build plugin from source"
            condition: ne(variables['pluginName'], '')

          - script: |
              set -e
              NAME="$(pluginName)"
              JAR=$(find "plugins/$NAME/target" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -1)
              unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -q '^pluginEntryClasses' || { echo "##vso[task.logissue type=error]$JAR missing pluginEntryClasses"; exit 1; }
            displayName: "Manifest has pluginEntryClasses"
            condition: ne(variables['pluginName'], '')

          - script: |
              set -e
              NAME="$(pluginName)"
              python3 - "$NAME" <<'PYEOF'
              import json, sys
              name = sys.argv[1]
              submission = json.load(open(f"plugins/{name}/.submission.json"))
              new_actions = set(submission.get("actions", []))
              if not new_actions:
                  sys.exit(0)
              registry = json.load(open("registry.json"))
              conflicts = []
              for p in registry.get("plugins", []):
                  if p.get("name") == name:
                      continue
                  overlap = new_actions & set(p.get("actions", []))
                  if overlap:
                      conflicts.append(f"{sorted(overlap)} already used by '{p.get('displayName', p.get('name'))}'")
              if conflicts:
                  print("##vso[task.logissue type=error]Action name conflict(s): " + "; ".join(conflicts))
                  sys.exit(1)
              PYEOF
            displayName: "No action-name conflicts with existing plugins"
            condition: ne(variables['pluginName'], '')

  - stage: SecurityScan
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: CheckmarxScan
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true # same reason as the Validate stage above -- needed so the git fetch origin right below can authenticate

          - script: |
              set -e
              TARGET_BRANCH=$(echo "$(System.PullRequest.TargetBranch)" | sed 's#refs/heads/##')
              git fetch origin "$TARGET_BRANCH"
              CHANGED=$(git diff --name-only "origin/$TARGET_BRANCH...HEAD" -- 'plugins/*' | awk -F/ '{print $2}' | sort -u)
              COUNT=$(echo "$CHANGED" | grep -c . || true)
              if [ "$COUNT" -eq 0 ]; then
                echo "No plugins/** changes in this PR -- nothing to scan, passing through."
                echo "##vso[task.setvariable variable=pluginName]"
              else
                echo "##vso[task.setvariable variable=pluginName]$CHANGED"
              fi
            displayName: "Determine changed plugin directory"

          # Cross-checked directly against a real working pipeline in the same ADO
          # project (P33148 -- the same project prefix already used for
          # ADO_FEED_SERVER_ID in publish-pipeline.yml, so this is the org's actual
          # Checkmarx One service connection for this project, not just a same-shaped
          # example from somewhere else) and against the task's own source
          # (github.com/Checkmarx/ast-azure-plugin, cxAstScan/task.json). That
          # cross-check caught two real bugs:
          #   - The input is CheckmarxService, capital C -- not the lowercase
          #     checkmarxService this file had before. A wrong input name is silently
          #     ignored by the task rather than erroring, so this would have quietly
          #     no-op'd instead of failing loudly the first time it ran.
          #   - scanTypes was never a real input either -- task.json lists exactly five
          #     inputs (CheckmarxService, projectName, branchName, tenantName,
          #     additionalParams) and scanTypes isn't one of them, the same silent-no-op
          #     class of bug. There's no dedicated field for scan type or threshold at
          #     all -- additionalParams is a raw passthrough of CLI flags to the
          #     underlying `cx` CLI, so both now live there instead (see below).
          #   - tenantName and branchName are required inputs this file was missing
          #     entirely. tenantName is a fixed org-wide value, copied as-is. branchName
          #     in the working example is a literal 'main' (that pipeline always scans
          #     one fixed branch); this stage instead derives it from
          #     System.PullRequest.SourceBranch the same way TARGET_BRANCH is already
          #     derived just above in the Validate stage, since this pipeline scans
          #     whatever branch a contributor's PR is actually from. That derivation is
          #     this file's own inference, not something the working example covered (it
          #     isn't a PR-validation pipeline) -- worth confirming on this stage's first
          #     real run.
          #   - checkmarxService: name of this project's "Checkmarx One" service connection
          #     (Project Settings -> Service connections) -- filled in below from the same
          #     working pipeline.
          #   - projectName: the Checkmarx One project this scan's results should file under.
          #     Using the plugin's own name keeps each contributor's plugin as its own
          #     Checkmarx project rather than one project for the whole registry repo.
          #
          # additionalParams sets two things via the CLI's own flags (Checkmarx One CLI
          # docs, "scan create"): `--scan-types sast` keeps this stage SAST-only (Reusable
          # Components are already out of scope entirely, and this stage has no reason to
          # also run SCA/IaC/etc. against a single plugin submission), and `--threshold`
          # fails the build on any Critical or High finding (zero tolerance) while leaving
          # Medium/Low/Info as report-only, never blocking. Verified against the task's
          # own source (services/TaskRunner.ts) that this is a real gate, not just a
          # report: the task calls
          # `taskLib.setResult(exitCode == 0 ? Succeeded : Failed, "")` on the CLI's exit
          # code with no middle "succeeded with issues" outcome, and a `--threshold`
          # breach is exactly what makes the CLI exit non-zero. Findings still get
          # recorded in the Checkmarx One project regardless of severity -- the threshold
          # only changes whether the task (and so this required PR check) fails, not
          # whether something gets scanned or logged.
          #
          # Critical/High at zero tolerance is a starting point, not a permanent one --
          # SAST on diverse third-party plugin code this project doesn't control the
          # style of is going to have some false-positive rate, and Medium is left
          # report-only for exactly that reason, rather than risking a maintainer just
          # force-merging around a noisy check. Revisit once this has actually run
          # against a batch of real submissions and the false-positive rate is known.
          - script: |
              set -e
              SOURCE_BRANCH=$(echo "$(System.PullRequest.SourceBranch)" | sed 's#refs/heads/##')
              echo "##vso[task.setvariable variable=sourceBranch]$SOURCE_BRANCH"
            displayName: "Determine PR source branch"
            condition: ne(variables['pluginName'], '')

          - task: CheckmarxAST@3
            inputs:
              CheckmarxService: "P33148-CheckmarxOne-SVC"
              projectName: "plugin-$(pluginName)"
              branchName: "$(sourceBranch)"
              tenantName: "ING"
              additionalParams: '--scan-types sast --threshold "sast-critical=0;sast-high=0"'
            displayName: "Checkmarx scan"
            condition: ne(variables['pluginName'], '')
