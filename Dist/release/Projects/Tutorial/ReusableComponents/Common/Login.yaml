schemaVersion: 1
testCase: Login
scenario: Common
steps:
  - step: 1
    object: Browser
    description: "Open the Url [<Data>] in the Browser"
    action: Open
    input: Login:URL

  - step: 2
    object: Username
    description: "Click the [<Object>] "
    action: Click
    reference: "[Project] Myfirstscript"

  - step: 3
    object: Username
    description: "Enter the value [<Data>] in the Field [<Object>]"
    action: Fill
    input: '%username%'
    reference: "[Project] Myfirstscript"

  - step: 4
    object: Password
    description: "Click the [<Object>] "
    action: Click
    reference: "[Project] Myfirstscript"

  - step: 5
    object: Password
    description: "Enter the value [<Data>] in the Field [<Object>]"
    action: Fill
    input: '%pwd%'
    reference: "[Project] Myfirstscript"

  - step: 6
    object: signin-submit
    description: "Click the [<Object>] "
    action: Click
    reference: "[Project] Myfirstscript"

  - step: 7
    object: Browser
    description: Store Storage State in JSON file
    action: StoreStorageState
    input: '@./login.json'
