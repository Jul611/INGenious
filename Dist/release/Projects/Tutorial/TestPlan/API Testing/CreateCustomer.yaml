schemaVersion: 1
testCase: CreateCustomer
scenario: API Testing
steps:
  - step: 1
    object: Webservice
    description: 'Set End Point '
    action: setEndPoint
    input: '@http://localhost:3000/customers'

  - step: 2
    object: Webservice
    description: 'Add Header '
    action: addHeader
    input: '@Content-Type=application/json'

  - step: 3
    object: Webservice
    description: 'POST Rest Request '
    action: postRestRequest
    input: "{     \"name\": \"Phillip Matthews\",     \"country\": \"New Zealand\"\
      \ }"

  - step: 4
    object: Webservice
    description: 'Assert Response Code '
    action: assertResponseCode
    input: '@200'

  - step: 5
    object: Webservice
    description: 'Store JSON Element In DataSheet '
    action: storeJSONelementInDataSheet
    input: API:CustomerID
    condition: $.id
