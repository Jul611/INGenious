schemaVersion: 1
testCase: CreateTransaction
scenario: API Testing
steps:
  - step: 1
    object: Webservice
    description: 'Set End Point '
    action: setEndPoint
    input: '@http://localhost:3000/transactions'

  - step: 2
    object: Webservice
    description: 'Add Header '
    action: addHeader
    input: '@Content-Type=application/json'

  - step: 3
    object: Webservice
    description: 'POST Rest Request '
    action: postRestRequest
    input: "{    \"accountId\": \"c408\",     \"amount\": 300,     \"date\": \"2024-07-14\"\
      ,     \"type\": \"deposit\"   }"

  - step: 4
    object: Webservice
    description: 'Assert Response Code '
    action: assertResponseCode
    input: '@201'

  - step: 5
    object: Webservice
    description: 'Store JSON Element In DataSheet '
    action: storeJSONelementInDataSheet
    input: API:TransactionID
    condition: $.id
