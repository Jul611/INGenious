schemaVersion: 1
testCase: CreateAccount
scenario: API Testing
steps:
  - step: 1
    object: Webservice
    description: 'Set End Point '
    action: setEndPoint
    input: '@http://localhost:3000/accounts'

  - step: 2
    object: Webservice
    description: 'Add Header '
    action: addHeader
    input: '@Content-Type=application/json'

  - step: 3
    object: Webservice
    description: 'POST Rest Request '
    action: postRestRequest
    input: "{     \"accountnumber\": \"134425267\",     \"customerId\": \"1de9\" \
      \ }"

  - step: 4
    object: Webservice
    description: 'Assert Response Code '
    action: assertResponseCode
    input: '@201'

  - step: 5
    object: Webservice
    description: 'Store JSON Element In DataSheet '
    action: storeJSONelementInDataSheet
    input: API:AccountID
    condition: $.id
