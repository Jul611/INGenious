schemaVersion: 1
testCase: GetCustomer
scenario: API Testing
steps:
  - step: 1
    object: Webservice
    description: 'Set End Point '
    action: setEndPoint
    input: '@http://localhost:3000/customers?id=1de9'

  - step: 2
    object: Webservice
    description: 'Add Header '
    action: addHeader
    input: '@Content-Type=application/json'

  - step: 3
    object: Webservice
    description: 'POST Rest Request '
    action: getRestRequest

  - step: 4
    object: Webservice
    description: 'Assert Response Code '
    action: assertResponseCode
    input: '@200'

  - step: 5
    object: Webservice
    description: 'Assert JSON Element Equals '
    action: assertJSONelementEquals
    input: '@Phillips Matthew'
    condition: "$.[0].name"
