schemaVersion: 1
testCase: UpdateCustomer
scenario: API Testing
steps:
  - step: 1
    object: Webservice
    description: 'Set End Point '
    action: setEndPoint
    input: '@http://localhost:3000/customers/1de9'

  - step: 2
    object: Webservice
    description: 'Add Header '
    action: addHeader
    input: '@Content-Type=application/json'

  - step: 3
    object: Webservice
    description: 'POST Rest Request '
    action: putRestRequest
    input: "{     \"name\": \"Phillips Matthew\",     \"country\": \"New Zealand\"\
      \ }"

  - step: 4
    object: Webservice
    description: 'Assert Response Code '
    action: assertResponseCode
    input: '@200'
