schemaVersion: 1
testCase: AuthenticateContext
scenario: Authenticate
steps:
  - step: 1
    object: Browser
    description: "Open the Url [<Data>] in the Browser"
    action: Open
    input: '@https://the-internet.herokuapp.com/basic_auth'

  - step: 2
    object: General
    description: "Wait for [<Data>] milli seconds"
    action: pause
    input: '@1000'

  - step: 3
    object: Browser
    description: 'Take a Screen Shot '
    action: TakePageScreenshot
